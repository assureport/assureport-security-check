# Copy to .github/workflows/security-check.yml in YOUR repo.
name: Security Check
on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC
permissions:
  contents: read
  pull-requests: write
jobs:
  assureport:
    runs-on: ubuntu-latest
    steps:
      - uses: YOUR-ORG/assureport-security-check@v1
        with:
          domain: example.com
